spring:
  application:
    name: order-service
  # P0-1：订单统一网关持久化（与 inventory-service 使用同一套凭据，避免配置分叉）
  datasource:
    url: jdbc:postgresql://localhost:5432/aslp
    username: aslp
    password: aslp123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

aslp:
  order:
    # true = MockAmazonStrategy；false = AmazonSpApiStrategy（需真实凭据）
    mock-enabled: true
    sync:
      # 本地默认关闭定时同步，避免开发时反复写入
      enabled: false
      cron: "0 */5 * * * *"
  # M4 数据库定时备份（pg_dump）参数
  backup:
    host: localhost
    port: 5432
    database: aslp
    username: aslp
    output-dir: /tmp
    enabled: false
