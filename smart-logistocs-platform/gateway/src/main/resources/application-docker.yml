spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Bug 修复：原 uri 为 lb://aslp_order_service:8081 —— lb:// 后必须跟服务名，
      # 且本项目未部署注册中心；现改为容器网络内直连容器名 + 端口。
      routes:
        - id: order-service
          uri: http://aslp_order_service:8081
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: http://aslp_inventory_service:8082
          predicates:
            - Path=/api/inventory/**
        - id: route-service
          uri: http://aslp_route_service:8083
          predicates:
            - Path=/api/routes/**,/api/route/**
        - id: report-service
          uri: http://aslp_report_service:8085
          predicates:
            - Path=/api/reports/**
        - id: auth-service
          uri: http://aslp_auth_service:8084
          predicates:
            - Path=/api/auth/**
server:
  port: 8080

# VPN 安全接入：JWT 公钥来源（auth-service 暴露的 JWKS 端点）
aslp:
  security:
    jwk-set-uri: http://aslp_auth_service:8084/api/auth/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
