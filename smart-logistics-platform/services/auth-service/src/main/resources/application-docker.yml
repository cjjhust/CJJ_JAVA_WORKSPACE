server:
  port: 8084

spring:
  application:
    name: auth-service
  # P2-6：容器内指向 aslp_postgres 服务名（独立 Flyway 历史表 flyway_schema_history_auth）
  datasource:
    url: jdbc:postgresql://aslp_postgres:5432/aslp
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    table: flyway_schema_history_auth
    baseline-on-migrate: true

aslp:
  jwt:
    # 容器环境请通过 docker-compose 的 environment 注入 ASLP_JWT_SECRET
    secret: ${ASLP_JWT_SECRET:aslp-dev-secret-key-change-me-in-production-0123456789}
    ttl-minutes: 120
    issuer: aslp-auth-service

management:
  # P1-3：链路追踪（容器内指向 aslp_zipkin）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 连字符别名（同 §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 必须同步加上 prometheus（否则 include 会覆盖基础 profile）
        include: health,info,prometheus,metrics
