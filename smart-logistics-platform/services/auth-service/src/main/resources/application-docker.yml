server:
  port: 8084

spring:
  config:
    # P2-2：接入配置中心（容器内指向服务名 aslp_config_server）
    import: "optional:configserver:${ASLP_CONFIG_SERVER:http://aslp-config-server:8888}"
  application:
    name: auth-service
  # P2-6：容器内指向 aslp_postgres 服务名（独立 Flyway 历史表 flyway_schema_history_auth）
  datasource:
    url: jdbc:postgresql://aslp_postgres:5432/aslp_auth
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    table: flyway_schema_history_auth
    baseline-on-migrate: true

aslp:
  jwt:
    # P0-2：RS256 非对称签名 —— 私钥启动时生成，公钥经 /api/auth/jwks.json 发布，
    # 网关经 JWKS 验签，容器间不再共享任何对称密钥。
    ttl-minutes: 120
    issuer: aslp-auth-service

management:
  # P0-1 安全基线：actuator 挪到独立管理端口（不向宿主机发布）。
  # 宿主机访问只能走网关（JWT 鉴权）；Prometheus 经容器网络直抓 9091。
  server:
    port: 9091
  # P1-3：链路追踪（容器内指向 aslp_zipkin）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 连字符别名（同 §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 必须同步加上 prometheus（否则 include 会覆盖基础 profile）
        include: health,info,prometheus,metrics

# P2-1：注册到 eureka-server（容器内指向服务名）
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://aslp-eureka-server:8761/eureka}
