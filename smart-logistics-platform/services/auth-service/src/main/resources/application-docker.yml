server:
  port: 8084

spring:
  application:
    name: auth-service

aslp:
  jwt:
    # 容器环境请通过 docker-compose 的 environment 注入 ASLP_JWT_SECRET
    secret: ${ASLP_JWT_SECRET:aslp-dev-secret-key-change-me-in-production-0123456789}
    ttl-minutes: 120
    issuer: aslp-auth-service

management:
  # P1-3：链路追踪（容器内指向 aslp_zipkin）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 连字符别名（同 §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 必须同步加上 prometheus（否则 include 会覆盖基础 profile）
        include: health,info,prometheus,metrics
