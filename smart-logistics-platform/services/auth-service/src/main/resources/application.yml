server:
  port: 8084

spring:
  application:
    name: auth-service
  # P2-6：真实用户存储（auth_user 表，Flyway 版本化）。
  # 与 order/inventory 共用同一 PostgreSQL，独立 Flyway 历史表避免互锁。
  datasource:
    url: jdbc:postgresql://localhost:5432/aslp
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    table: flyway_schema_history_auth
    baseline-on-migrate: true

# JWT 签发配置（M1 认证服务 / M4 网关 VPN 接入的令牌来源）
aslp:
  jwt:
    # 生产环境请通过环境变量 ASLP_JWT_SECRET 注入，切勿使用默认值
    secret: ${ASLP_JWT_SECRET:aslp-dev-secret-key-change-me-in-production-0123456789}
    ttl-minutes: 120
    issuer: aslp-auth-service

management:
  # P1-3：链路追踪
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：暴露 Prometheus 抓取端点
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
