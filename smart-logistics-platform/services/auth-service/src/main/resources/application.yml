server:
  port: 8084

spring:
  application:
    name: auth-service
  # P2-6：真实用户存储（auth_user 表，Flyway 版本化）。
  # 与 order/inventory 共用同一 PostgreSQL，独立 Flyway 历史表避免互锁。
  datasource:
    url: jdbc:postgresql://localhost:5432/aslp
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/auth
    table: flyway_schema_history_auth
    baseline-on-migrate: true

# JWT 签发配置（M1 认证服务 / M4 网关 VPN 接入的令牌来源）
aslp:
  jwt:
    # P0-2：RS256 非对称签名 —— 私钥由 JwtTokenService 启动时生成（演示定位），
    # 公钥经 /api/auth/jwks.json 发布，网关经 JWKS 验签。不再使用对称密钥。
    ttl-minutes: 120
    issuer: aslp-auth-service

management:
  # P1-3：链路追踪
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：暴露 Prometheus 抓取端点
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
