# Testcontainers 全局配置（classpath 根目录，所有模块生效）
#
# api.version：覆盖 docker-java 的 API 版本协商。
# Testcontainers 的 EnvironmentAndSystemPropertyClientProviderStrategy 会显式
# withApiVersion(1.32)，而 Docker Desktop 2025+（Engine 29.x）把 MinAPIVersion
# 提到了 1.40 —— /v1.32/* 一律返回 400，容器起不来。
# 这里统一指定 1.44（Engine 29 兼容，且向下兼容 25.x/26.x）。
api.version=1.44
