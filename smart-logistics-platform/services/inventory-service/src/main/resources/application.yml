server:
  port: 8082

spring:
  application:
    name: inventory-service
  # Bug 修复：原 redisson.singleServerConfig.* 不会被 redisson-spring-boot-starter 绑定
  #（该 starter 仅绑定 spring.data.redis.* 与 spring.redis.redisson.{config,file}），
  # 属性被静默忽略后回落默认值 localhost:6379；本地因端口映射"碰巧"可用，
  # 容器内必然 Connection refused。现改用 starter 真正识别的命名空间。
  data:
    redis:
      host: localhost
      port: 6379
  # Bug 修复：原配置为 db=smart_logistics / user=postgres，与 docker-compose 的
  # aslp/aslp123 不一致，导致服务连不上数据库。现统一为 aslp。
  datasource:
    url: jdbc:postgresql://localhost:5432/aslp
    username: aslp
    password: aslp123
  # P0-4：架构由 Flyway 版本化管理（含两仓种子数据），Hibernate 仅校验
  flyway:
    enabled: true
    locations: classpath:db/migration/inventory
    # 与 order-service 共用同一库，各自使用独立历史表
    table: flyway_schema_history_inventory
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  mail:
    # P1-5：指向本机 MailHog（`docker compose up -d aslp_mailhog` 后即可在
    # http://localhost:8025 看到邮件；MailHog 只在容器里跑，本地不需自建 SMTP 服务）
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

management:
  # P1-3：链路追踪
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：暴露 Prometheus 抓取端点
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    # Bug 修复（P1-1/P1-5）：默认 MailHealthIndicator 会在每次 /actuator/health 时探测 SMTP，
    # 开发机没起 MailHog 时整个服务被判为 DOWN（HTTP 503），
    # 导致本地 `smoke-test.sh` 的就绪等待与 /actuator/health 断言失败。
    # 因此：**本地关、容器开**（容器里有真实的 aslp_mailhog，见 application-docker.yml）——
    # 「邮件发不出去」这件事在真正部署的形态下必须能被健康检查看见。
    mail:
      enabled: false

# P1-5：库存预警与补货邮件参数（与 application-docker.yml 保持一致，仅注释差异）
aslp:
  inventory:
    warning:
      threshold: 10
      target-multiplier: 2
      recipient: warehouse-manager@aslp.internal
      subject-prefix: "[库存补货建议]"
      # 巡检周期：毫秒数（@Scheduled 的 String 形式不认 60s 简写，见 §9 #44）
      check-interval-ms: 60000
      mail-interval: 30m
