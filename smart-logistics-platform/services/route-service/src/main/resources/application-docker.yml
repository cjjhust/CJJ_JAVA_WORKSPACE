server:
  port: 8083

spring:
  config:
    # P2-2：接入配置中心（容器内指向服务名 aslp_config_server）
    import: "optional:configserver:${ASLP_CONFIG_SERVER:http://aslp-config-server:8888}"
  # P1-6：追踪事件表持久化（与 order/inventory 同库，独立 Flyway 历史表）
  datasource:
    url: jdbc:postgresql://aslp_postgres:5432/aslp_route
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/route
    table: flyway_schema_history_route
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  application:
    name: route-service

# P1-9：容器内走 WireMock 契约桩（fake 凭据，非密钥），以便端到端断言
# 「429 / 5xx / 查无此单 / 契约归一化」这些**没有生产凭据也验证不了**的行为。
# 连字符别名 aslp-wiremock（下划线主机名对 java.net.URI 非法，见 §9 #21/#30/#35）。
aslp:
  tracking:
    mock-enabled: false
    dhl-base-url: http://aslp-wiremock:8080
    dhl-api-key: aslp-wiremock-dhl-key
    dpd-base-url: http://aslp-wiremock:8080
    dpd-api-key: aslp-wiremock-dpd-key
    connect-timeout: 2s
    # 故意短于"超时桩"的延迟（3s）：用来证明读超时真的生效，而不是等对方返回
    read-timeout: 1s
    cache-ttl: 60s
    max-cache-entries: 1000
    max-events: 30

management:
  # P0-1 安全基线：actuator 挪到独立管理端口（不向宿主机发布）。
  # 宿主机访问只能走网关（JWT 鉴权）；Prometheus 经容器网络直抓 9091。
  server:
    port: 9091
  # P1-3：链路追踪（容器内指向 aslp_zipkin）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 连字符别名（同 §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 必须同步加上 prometheus（否则 include 会覆盖基础 profile）
        include: health,info,prometheus,metrics

# P2-1：注册到 eureka-server（容器内指向服务名）
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://aslp-eureka-server:8761/eureka}
