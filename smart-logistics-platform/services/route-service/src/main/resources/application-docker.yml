server:
  port: 8083

spring:
  application:
    name: route-service

management:
  # P1-3：链路追踪（容器内指向 aslp_zipkin）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 连字符别名（同 §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 必须同步加上 prometheus（否则 include 会覆盖基础 profile）
        include: health,info,prometheus,metrics
