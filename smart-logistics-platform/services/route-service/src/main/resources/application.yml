server:
  port: 8083

spring:
  config:
    # P2-2：接入配置中心（optional：config-server 未启动时以本地配置起跑，不阻塞启动）
    import: "optional:configserver:${ASLP_CONFIG_SERVER:http://localhost:8888}"
  # P1-6：追踪事件表持久化（与 order/inventory 同库，独立 Flyway 历史表）
  datasource:
    url: jdbc:postgresql://localhost:5432/aslp
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/route
    table: flyway_schema_history_route
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  application:
    name: route-service

# P1-9：尾程追踪（DHL / DPD 一单到底）。
# 本地默认 mock-enabled=true：没有生产凭据也能完整演示"承运商报文 → 归一化状态 → 视图"的全过程。
# 接真实接口时置 false 并注入 DHL_API_KEY / DPD_API_KEY（凭据不写进仓库）。
aslp:
  tracking:
    mock-enabled: true
    dhl-base-url: https://api-eu.dhl.com
    dhl-api-key: ${DHL_API_KEY:}
    dpd-base-url: https://api.dpd.com
    dpd-api-key: ${DPD_API_KEY:}
    # 超时必须显式：JDK 默认读超时是"无限等待"，承运商僵死会拖住 route-service 的线程池
    connect-timeout: 2s
    read-timeout: 5s
    # 承运商有配额、包裹状态变化慢（分钟级）→ 短时复用；?refresh=true 可强制穿透
    cache-ttl: 60s
    max-cache-entries: 1000
    max-events: 30

management:
  # P1-3：链路追踪
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 开启直方图桶，Grafana 才能用 histogram_quantile 算 P95/P99
        http.server.requests: true
        # VRP 求解是 M3 最重的计算路径，单靠 count/sum 只能算均值，掩盖长尾
        aslp.vrp.solve: true

# P2-1：注册到 eureka-server（本地开发指向 localhost）
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
