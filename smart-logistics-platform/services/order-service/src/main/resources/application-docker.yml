spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://aslp_postgres:5432/aslp
    username: aslp
    password: aslp123
  flyway:
    enabled: true
    locations: classpath:db/migration/order
    table: flyway_schema_history_order
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # P1-2：暴露熔断器状态/事件端点，便于端到端断言「熔断已打开」
        # P1-1：docker profile 必须同步加上 prometheus（否则 include 会覆盖基础 profile）
        include: health,info,circuitbreakers,circuitbreakerevents,prometheus,metrics

# P1-2：平台调用容错（与本地 profile 保持一致，仅注释差异）
resilience4j:
  retry:
    instances:
      platformPull:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.aslp.order.strategy.PlatformUnavailableException
  circuitbreaker:
    instances:
      platformPull:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
  bulkhead:
    instances:
      platformPull:
        max-concurrent-calls: 4
        max-wait-duration: 200ms

aslp:
  order:
    mock-enabled: true
    sync:
      # 容器环境开启定时自动导入（M1 流水线式导入）
      enabled: true
      cron: "0 */5 * * * *"
  # M4 数据库定时备份（容器内指向 aslp_postgres 服务名）
  backup:
    host: aslp_postgres
    port: 5432
    database: aslp
    username: aslp
    output-dir: /tmp
    enabled: true
