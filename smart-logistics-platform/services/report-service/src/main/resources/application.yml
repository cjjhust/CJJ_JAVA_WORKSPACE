server:
  port: 8085
spring:
  application:
    name: report-service

# P1-1：可观测性——暴露 Prometheus 抓取端点并给指标打上服务名标签
management:
  # P1-3：链路追踪
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
