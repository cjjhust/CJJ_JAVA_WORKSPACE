# =============================================================================
# Smart Logistics Platform (ASLP) — 基础设施 + 6 个 Java 微服务
#
# 容器名统一 aslp_* 前缀，网络 aslp_net，避免与其他 Docker Compose 项目冲突。
# 切换项目前执行：docker compose down（不加 -v 保留数据卷）
#
# 【URI 安全命名】下划线在 RFC 2396 中不是合法的主机名字符：java.net.URI 会把
# "http://aslp_order_service:8081" 解析为 registry-based authority（getHost()==null、
# getPort()==-1），使 Spring Cloud Gateway 在构建路由 URI 时命中「无端口」重建分支
# 并抛 URISyntaxException（Expected scheme-specific part at index 5: http:）导致启动失败。
# 因此「被网关路由寻址」的服务额外声明连字符别名（aslp-xxx）供 URI 使用；
# container_name 仍保持 aslp_* 以延续上文的防冲突约定。
# 注：JDBC（PostgreSQL）/ Kafka / Redisson 各有宽松解析器，继续使用 aslp_* 即可。
#
# 构建说明：所有 Java 服务共用根目录 Dockerfile，通过 build.args.MODULE 选择模块。
# =============================================================================

name: aslp

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - aslp_net

services:
  # ---------------------------- 基础设施 ----------------------------
  aslp_postgres:
    image: postgres:16-alpine
    container_name: aslp_postgres
    environment:
      POSTGRES_DB: aslp
      POSTGRES_USER: aslp
      POSTGRES_PASSWORD: aslp123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - aslp_pg_data:/var/lib/postgresql/data
      # 表结构与种子数据由各服务的 Flyway 迁移负责（见
      # services/*/src/main/resources/db/migration/），不再使用
      # /docker-entrypoint-initdb.d，避免出现两份真相源导致漂移。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aslp -d aslp"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aslp_net

  aslp_redis:
    image: redis:7-alpine
    container_name: aslp_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aslp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aslp_net

  aslp_zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: aslp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aslp_net

  aslp_kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aslp_kafka
    depends_on:
      aslp_zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: aslp_zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://aslp_kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - aslp_net

  # 对象存储：镜像源在部分网络环境无法拉取，默认注释。
  # aslp_minio:
  #   image: minio/minio:latest
  #   container_name: aslp_minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - aslp_minio_data:/data
  #   networks:
  #     - aslp_net

  # ---------------------------- Java 微服务 ----------------------------
  # 入口网关 + BFF（WebFlux）。统一使用根 Dockerfile，按 MODULE 构建。
  aslp_gateway:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    image: aslp/gateway:1.0.0
    container_name: aslp_gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      # VPN 安全接入：与 auth-service 共享同一密钥用于校验 JWT（生产请外部注入强随机值）
      ASLP_JWT_SECRET: ${ASLP_JWT_SECRET:-aslp-dev-secret-key-change-me-in-production-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      aslp_postgres:
        condition: service_healthy
      aslp_redis:
        condition: service_healthy

  aslp_order_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/order-service
    image: aslp/order-service:1.0.0
    container_name: aslp_order_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      aslp_postgres:
        condition: service_healthy

  aslp_inventory_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/inventory-service
    image: aslp/inventory-service:1.0.0
    container_name: aslp_inventory_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      aslp_postgres:
        condition: service_healthy
      aslp_redis:
        condition: service_healthy

  aslp_route_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/route-service
    image: aslp/route-service:1.0.0
    container_name: aslp_route_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-route-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
    ports:
      - "8083:8083"

  aslp_auth_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/auth-service
    image: aslp/auth-service:1.0.0
    container_name: aslp_auth_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      # 生产环境请改为外部注入的强随机密钥
      ASLP_JWT_SECRET: ${ASLP_JWT_SECRET:-aslp-dev-secret-key-change-me-in-production-0123456789}
    ports:
      - "8084:8084"

  aslp_report_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/report-service
    image: aslp/report-service:1.0.0
    container_name: aslp_report_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-report-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
    ports:
      - "8085:8085"

  # ---------------------------- 可观测性（P1-1） ----------------------------
  # 所有 Java 服务已通过 micrometer-registry-prometheus 暴露 /actuator/prometheus；
  # 这里把它们抓下来存 7 天，Grafana 负责出图。
  aslp_prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aslp_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # 允许热加载：curl -X POST localhost:9090/-/reload，改抓取配置不用重启容器
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aslp_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      # 镜像自带 busybox wget（已实测 /bin/wget），故可用 --spider 做探活
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aslp_net

  aslp_grafana:
    image: grafana/grafana:11.3.0
    container_name: aslp_grafana
    environment:
      # 演示环境：开放匿名只读访问，浏览器直开 http://localhost:3000 就能看图。
      # 生产环境必须关掉匿名访问并接入统一认证（见 readme §10 限制）。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-aslp-admin}
    volumes:
      # 数据源 + 看板全部以文件形式版本化管理，容器启动即自动加载
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aslp_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      aslp_prometheus:
        condition: service_started
    # 注：grafana/grafana 镜像内没有 curl/wget（已实测），故不设容器内健康检查；
    # 就绪与否由冒烟脚本访问 /api/health = database ok 来断言。
    networks:
      - aslp_net

volumes:
  aslp_pg_data:
    name: aslp_pg_data
  aslp_redis_data:
    name: aslp_redis_data
  aslp_prometheus_data:
    name: aslp_prometheus_data
  aslp_grafana_data:
    name: aslp_grafana_data

networks:
  aslp_net:
    name: aslp_net
    driver: bridge
