# =============================================================================
# Smart Logistics Platform (ASLP) — 基础设施 + 6 个 Java 微服务
#
# 容器名统一 aslp_* 前缀，网络 aslp_net，避免与其他 Docker Compose 项目冲突。
# 切换项目前执行：docker compose down（不加 -v 保留数据卷）
#
# 【URI 安全命名】下划线在 RFC 2396 中不是合法的主机名字符：java.net.URI 会把
# "http://aslp_order_service:8081" 解析为 registry-based authority（getHost()==null、
# getPort()==-1），使 Spring Cloud Gateway 在构建路由 URI 时命中「无端口」重建分支
# 并抛 URISyntaxException（Expected scheme-specific part at index 5: http:）导致启动失败。
# 因此「被网关路由寻址」的服务额外声明连字符别名（aslp-xxx）供 URI 使用；
# container_name 仍保持 aslp_* 以延续上文的防冲突约定。
# 注：JDBC（PostgreSQL）/ Kafka / Redisson 各有宽松解析器，继续使用 aslp_* 即可。
#
# 构建说明：所有 Java 服务共用根目录 Dockerfile，通过 build.args.MODULE 选择模块。
# =============================================================================

name: aslp

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - aslp_net

services:
  # ---------------------------- 基础设施 ----------------------------
  aslp_postgres:
    image: postgres:16-alpine
    container_name: aslp_postgres
    environment:
      POSTGRES_DB: aslp
      POSTGRES_USER: aslp
      POSTGRES_PASSWORD: aslp123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - aslp_pg_data:/var/lib/postgresql/data
      # 表结构与种子数据由各服务的 Flyway 迁移负责（见
      # services/*/src/main/resources/db/migration/），不再使用
      # /docker-entrypoint-initdb.d，避免出现两份真相源导致漂移。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aslp -d aslp"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aslp_net

  aslp_redis:
    image: redis:7-alpine
    container_name: aslp_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aslp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aslp_net

  aslp_zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: aslp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aslp_net

  aslp_kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aslp_kafka
    depends_on:
      aslp_zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: aslp_zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://aslp_kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - aslp_net

  # P1-5：MailHog —— 真实 SMTP + Web 收件箱（开发/演示用）
  # 补货邮件不再"发到空气里"：:1025 收信，:8025 直接看 HTML 正文（含 traceId 关联的告警）。
  # 注：官方镜像只有 amd64（Apple Silicon 上走 Rosetta/qemu 模拟，实测可用）；
  #     若要原生 arm64 可换 axllent/mailpit（MailHog API 兼容的活跃替代品）。
  aslp_mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aslp_mailhog
    networks:
      aslp_net:
        aliases:
          - aslp-mailhog
    ports:
      # 1025 = SMTP（服务发信），8025 = Web UI + REST API（冒烟脚本断言邮件内容）
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      # 镜像内自带 wget（已实测；没有 curl）
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8025/api/v2/messages"]
      interval: 5s
      timeout: 3s
      retries: 12

  # P1-6：MinIO —— 面单/报关单 PDF 对象存储（S3 兼容）
  # 注：Docker Hub 上的 minio/minio 已下线（pull 会报 repository does not exist），
  #     官方镜像现在在 quay.io（已实测可拉）。版本按 release tag 钉死，保证可重复构建。
  aslp_minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aslp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aslp-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aslp-minio-secret}
    networks:
      aslp_net:
        aliases:
          - aslp-minio
    ports:
      # 9000 = S3 API（服务端 + 预签名 URL），9001 = 控制台（浏览器看桶/对象）
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aslp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------- Java 微服务 ----------------------------
  # 入口网关 + BFF（WebFlux）。统一使用根 Dockerfile，按 MODULE 构建。
  aslp_gateway:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    image: aslp/gateway:1.0.0
    container_name: aslp_gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      # VPN 安全接入：与 auth-service 共享同一密钥用于校验 JWT（生产请外部注入强随机值）
      ASLP_JWT_SECRET: ${ASLP_JWT_SECRET:-aslp-dev-secret-key-change-me-in-production-0123456789}
    ports:
      - "8080:8080"
    depends_on:
      aslp_postgres:
        condition: service_healthy
      aslp_redis:
        condition: service_healthy

  aslp_order_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/order-service
    image: aslp/order-service:1.0.0
    container_name: aslp_order_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      aslp_postgres:
        condition: service_healthy
      # P1-6：单据存储是硬依赖（面单/报关单都要写它），启动前等 MinIO 就绪，
      # 否则 /actuator/health 里的 minio 组件一出场就是 DOWN
      aslp_minio:
        condition: service_healthy

  aslp_inventory_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/inventory-service
    image: aslp/inventory-service:1.0.0
    container_name: aslp_inventory_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      aslp_postgres:
        condition: service_healthy
      aslp_redis:
        condition: service_healthy
      # P1-5：邮件健康探测已开启（mail.enabled=true），SMTP 没就绪会把自己判 DOWN
      aslp_mailhog:
        condition: service_healthy

  aslp_route_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/route-service
    image: aslp/route-service:1.0.0
    container_name: aslp_route_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-route-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
    ports:
      - "8083:8083"

  aslp_auth_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/auth-service
    image: aslp/auth-service:1.0.0
    container_name: aslp_auth_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      # 生产环境请改为外部注入的强随机密钥
      ASLP_JWT_SECRET: ${ASLP_JWT_SECRET:-aslp-dev-secret-key-change-me-in-production-0123456789}
    ports:
      - "8084:8084"

  aslp_report_service:
    <<: *java-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/report-service
    image: aslp/report-service:1.0.0
    container_name: aslp_report_service
    # RFC 2396 合法主机名（见文件头「URI 安全命名」），供网关路由寻址
    networks:
      aslp_net:
        aliases:
          - aslp-report-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
    ports:
      - "8085:8085"

  # ---------------------------- 可观测性（P1-1） ----------------------------
  # 所有 Java 服务已通过 micrometer-registry-prometheus 暴露 /actuator/prometheus；
  # 这里把它们抓下来存 7 天，Grafana 负责出图。
  aslp_prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aslp_prometheus
    # 与 Loki/Zipkin 一致：对外连接的地址一律用连字符别名（见 §9 #35 的教训）
    networks:
      aslp_net:
        aliases:
          - aslp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # 允许热加载：curl -X POST localhost:9090/-/reload，改抓取配置不用重启容器
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aslp_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      # 镜像自带 busybox wget（已实测 /bin/wget），故可用 --spider 做探活
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  aslp_grafana:
    image: grafana/grafana:11.3.0
    container_name: aslp_grafana
    environment:
      # 演示环境：开放匿名只读访问，浏览器直开 http://localhost:3000 就能看图。
      # 生产环境必须关掉匿名访问并接入统一认证（见 readme §10 限制）。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-aslp-admin}
    volumes:
      # 数据源 + 看板全部以文件形式版本化管理，容器启动即自动加载
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aslp_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      aslp_prometheus:
        condition: service_started
    # 注：grafana/grafana 镜像内没有 curl/wget（已实测），故不设容器内健康检查；
    # 就绪与否由冒烟脚本访问 /api/health = database ok 来断言。
    networks:
      - aslp_net

  # ---------------------------- 链路追踪（P1-3） ----------------------------
  # 接收各服务上报的 span（各服务 management.zipkin.tracing.endpoint 指向它）。
  aslp_zipkin:
    image: openzipkin/zipkin:latest
    container_name: aslp_zipkin
    # RFC 2396 合法主机名（同理见文件头「URI 安全命名」）：
    # 网关是 WebFlux，上报 span 走 WebClient -> java.net.URI，
    # 写成 aslp_zipkin 会得到 “Host is not specified”（实测）——
    # 而 Servlet 服务用 URLConnection/HttpURLConnection 解析较宽松，所以只有网关上不出来。
    networks:
      aslp_net:
        aliases:
          - aslp-zipkin
    environment:
      # 演示用内存存储（重启即清空）；生产应换成 Elasticsearch/Cassandra
      STORAGE_TYPE: mem
      # 限住堆，避免本地演示吃满资源
      JAVA_OPTS: -Xms64m -Xmx256m
    ports:
      - "9411:9411"
    healthcheck:
      # 镜像自带 wget（已实测 /usr/bin/wget），/health 返回 {"status":"UP"}
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    # networks 已在服务开头声明（需带别名）

  # ---------------------------- 日志聚合（P1-1b）----------------------------
  # 各服务直接输出到 stdout（不落文件）→ Promtail 经 Docker API 流式采集 → Loki 存储 → Grafana 查看。
  # 注意：Promtail 必须用 **Docker API** 而不是 tail 容器日志文件：
  # Docker Desktop for macOS 的 /var/lib/docker 在虚拟机里，挂进容器只会得到空目录（已实测）。
  aslp_loki:
    image: grafana/loki:3.2.0
    container_name: aslp_loki
    # RFC 2396 合法主机名：Promtail 与 Grafana 都按这个别名寻址（同理见文件头「URI 安全命名」）
    networks:
      aslp_net:
        aliases:
          - aslp-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - aslp_loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      # 镜像自带 wget（已实测）；/ready 就绪时返回 200
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  aslp_promtail:
    image: grafana/promtail:3.2.0
    container_name: aslp_promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # 只读挂载 Docker socket：Promtail 靠它发现容器并流式读日志（已实测可挂载）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9080:9080"
    depends_on:
      aslp_loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aslp_net

  # P1-4：Amazon SP-API 契约桩（WireMock）。
  # order-service 的诊断探针（POST /api/orders/spapi/probe）把它当作真实平台来打，
  # 于是「真实 HTTP 请求 + LWA 换令牌 + 分页 + 429 限流 + 超时」整条链路
  # 在容器环境里可以端到端断言，而不需要真实卖家账号。
  # 桩定义是仓库里的文件（./wiremock/mappings/*.json），不是 compose 内联 YAML ——
  # 与 P1-1/P1-1b 的 monitoring/ 同一思路：契约是要进代码评审的资产。
  aslp_wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: aslp_wiremock
    command: ["--root-dir", "/home/wiremock"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      # 宿主 8099：冒烟脚本直接查 /__admin/* 来验证「桩确实被调用过几次」
      - "8099:8080"
    networks:
      aslp_net:
        aliases:
          - aslp-wiremock
    healthcheck:
      # 镜像自带 curl（已实测）
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  aslp_pg_data:
    name: aslp_pg_data
  aslp_redis_data:
    name: aslp_redis_data
  aslp_prometheus_data:
    name: aslp_prometheus_data
  aslp_grafana_data:
    name: aslp_grafana_data
  aslp_loki_data:
    name: aslp_loki_data
  aslp_minio_data:
    name: aslp_minio_data

networks:
  aslp_net:
    name: aslp_net
    driver: bridge
