server:
  port: 8888

spring:
  application:
    name: config-server
  # 注意：spring.profiles.active 只能放在基础 application.yml（Boot 禁止在
  # profile 专属文件里再声明 active profile，否则启动即抛 InvalidConfigDataPropertyException）。
  # native 后端与 search-locations 已在基础文件里声明，docker profile 无需覆盖。
  cloud:
    config:
      server:
        native:
          search-locations: classpath:config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
