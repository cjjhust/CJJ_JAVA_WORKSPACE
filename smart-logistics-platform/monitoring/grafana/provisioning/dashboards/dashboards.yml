# =============================================================================
# ASLP — Grafana 看板自动加载（P1-1）
#
# 看板以文件形式版本化管理（monitoring/grafana/dashboards/*.json），
# 容器启动即加载，改完 docker compose restart aslp_grafana 生效。
# allowUiUpdates: true 允许在界面上试改并导出，但仓库里的 JSON 才是唯一真相源。
# =============================================================================

apiVersion: 1

providers:
  - name: aslp
    orgId: 1
    folder: ASLP
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
