# =============================================================================
# ASLP — Grafana 数据源自动配置（P1-1）
#
# uid 固定为 aslp-prometheus：看板 JSON 里按 uid 引用数据源，
# 不固定的话每次重建数据源都会拿到新 uid，看板就会「No data」。
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: aslp-prometheus
    type: prometheus
    access: proxy
    # 走容器网络内的服务名，端口是容器内端口（不是宿主机映射端口）
    # 用连字符别名而不是容器名：凡拼接 URL 的地方一律避免下划线主机名（见 readme §9 #35）
    url: http://aslp-prometheus:9090
    isDefault: true
    editable: true
