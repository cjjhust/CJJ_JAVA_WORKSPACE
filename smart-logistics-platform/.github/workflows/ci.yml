name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers 需要 Docker：ubuntu-latest runner 自带，无需额外安装。
      # 涵盖：全部单元测试 + P2-8 仓储集成测试（真 PG）+ P2-7 单体装配冒烟测试（PG + Redis）。
      - name: Build & Test
        run: mvn -B test

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
