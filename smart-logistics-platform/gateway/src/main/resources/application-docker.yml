spring:
  application:
    name: gateway
  # P1-2：限流令牌桶存于 Redis（容器内容器名寻址；JDBC/Redisson 同理由此复用 aslp_* 约定）
  data:
    redis:
      host: aslp_redis
      port: 6379
  cloud:
    gateway:
      # Bug 修复（1）：原 uri 为 lb://aslp_order_service:8081 —— lb:// 后必须跟服务名，
      # 且本项目未部署注册中心；现改为容器网络内直连服务名 + 端口。
      #
      # Bug 修复（2）：主机名不得使用下划线（RFC 2396 的 hostname 只允许字母/数字/-/.）。
      # java.net.URI 会把含下划线的主机名当作 registry-based authority
      #（getHost()==null、getPort()==-1），于是 Spring Cloud Gateway 的
      # Route.AbstractBuilder.uri(URI) 会走进「http 且无显式端口」分支，对 URI 做
      # UriComponentsBuilder.fromUri(...).port(80).build(true).toUri() 重建；authority
      # 在此过程中丢失，最终生成非法字符串 "http:"，启动即抛：
      #   URISyntaxException: Expected scheme-specific part at index 5: http:
      # 故此处统一使用 compose 中声明的连字符网络别名（aslp-xxx，见 docker-compose.yml 文件头）。
      #
      # P1-2：限流采用**按需路由级**而非 default-filters 全局（原因见 RateLimitConfig 类注释）。
      routes:
        # P1-2：平台拉取接口单独收口（每用户 1 次/秒，burst 1），
        # 对应 M1「针对电商平台 API 的严格限流」。
        - id: order-pull-throttle
          uri: http://aslp-order-service:8081
          order: -1
          predicates:
            - Path=/api/orders/pull
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: order-service
          uri: http://aslp-order-service:8081
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: http://aslp-inventory-service:8082
          predicates:
            - Path=/api/inventory/**
        - id: route-service
          uri: http://aslp-route-service:8083
          predicates:
            - Path=/api/routes/**,/api/route/**
        - id: report-service
          uri: http://aslp-report-service:8085
          predicates:
            - Path=/api/reports/**
        - id: auth-service
          uri: http://aslp-auth-service:8084
          predicates:
            - Path=/api/auth/**
          filters:
            # 认证入口按 IP 限流：登录前没有用户身份，只能以 IP 为维度防暴力破解
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
server:
  port: 8080

# VPN 安全接入：与 auth-service 共享 HS384 对称密钥（由 compose 注入 ASLP_JWT_SECRET）
# 生产环境建议升级为 RS256 + JWKS（见 todo.md P2-5）
aslp:
  security:
    jwt:
      secret: ${ASLP_JWT_SECRET:aslp-dev-secret-key-change-me-in-production-0123456789}

management:
  # P1-3：链路追踪（容器内指向 aslp_zipkin；全量采样仅适合演示）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 必须用连字符别名：下划线主机名会让 java.net.URI 解析不出 host，
      # 网关（WebFlux/WebClient）上报时报 “Host is not specified”（见 readme §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 同样需要 prometheus（否则此处的 include 会覆盖基础 profile 而丢掉抓取端点）
        include: health,info,gateway,prometheus,metrics
