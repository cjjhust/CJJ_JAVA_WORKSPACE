spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Bug 修复（1）：原 uri 为 lb://aslp_order_service:8081 —— lb:// 后必须跟服务名，
      # 且本项目未部署注册中心；现改为容器网络内直连服务名 + 端口。
      #
      # Bug 修复（2）：主机名不得使用下划线（RFC 2396 的 hostname 只允许字母/数字/-/.）。
      # java.net.URI 会把含下划线的主机名当作 registry-based authority
      #（getHost()==null、getPort()==-1），于是 Spring Cloud Gateway 的
      # Route.AbstractBuilder.uri(URI) 会走进「http 且无显式端口」分支，对 URI 做
      # UriComponentsBuilder.fromUri(...).port(80).build(true).toUri() 重建；authority
      # 在此过程中丢失，最终生成非法字符串 "http:"，启动即抛：
      #   URISyntaxException: Expected scheme-specific part at index 5: http:
      # 故此处统一使用 compose 中声明的连字符网络别名（aslp-xxx，见 docker-compose.yml 文件头）。
      routes:
        - id: order-service
          uri: http://aslp-order-service:8081
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: http://aslp-inventory-service:8082
          predicates:
            - Path=/api/inventory/**
        - id: route-service
          uri: http://aslp-route-service:8083
          predicates:
            - Path=/api/routes/**,/api/route/**
        - id: report-service
          uri: http://aslp-report-service:8085
          predicates:
            - Path=/api/reports/**
        - id: auth-service
          uri: http://aslp-auth-service:8084
          predicates:
            - Path=/api/auth/**
server:
  port: 8080

# VPN 安全接入：与 auth-service 共享 HS384 对称密钥（由 compose 注入 ASLP_JWT_SECRET）
# 生产环境建议升级为 RS256 + JWKS（见 todo.md P2-5）
aslp:
  security:
    jwt:
      secret: ${ASLP_JWT_SECRET:aslp-dev-secret-key-change-me-in-production-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
