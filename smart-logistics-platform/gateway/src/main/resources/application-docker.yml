spring:
  application:
    name: gateway
  # P1-2：限流令牌桶存于 Redis（容器内容器名寻址；JDBC/Redisson 同理由此复用 aslp_* 约定）
  data:
    redis:
      host: aslp_redis
      port: 6379
  cloud:
    gateway:
      # P2-1：服务发现寻址（eureka-server 就绪后启用）。lb:// 后必须跟**服务名**（spring.application.name），
      # 由 loadbalancer 从注册表解析实例 —— 实例扩容/换端口零配置变更。
      #
      # 历史 Bug 备忘（仍适用）：主机名不得使用下划线（RFC 2396 的 hostname 只允许字母/数字/-/.）。
      # java.net.URI 会把含下划线的主机名当作 registry-based authority
      #（getHost()==null、getPort()==-1），导致路由 URI 重建后生成非法串 "http:"，启动即抛：
      #   URISyntaxException: Expected scheme-specific part at index 5: http:
      # compose 侧仍统一使用连字符网络别名（aslp-xxx，见 docker-compose.yml 文件头）。
      #
      # P1-2：限流采用**按需路由级**而非 default-filters 全局（原因见 RateLimitConfig 类注释）。
      routes:
        # P1-2：平台拉取接口单独收口（每用户 1 次/秒，burst 1），
        # 对应 M1「针对电商平台 API 的严格限流」。
        - id: order-pull-throttle
          uri: lb://order-service
          order: -1
          predicates:
            - Path=/api/orders/pull
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: route-service
          uri: lb://route-service
          predicates:
            - Path=/api/routes/**,/api/route/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            # 认证入口按 IP 限流：登录前没有用户身份，只能以 IP 为维度防暴力破解
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

# P2-1：注册中心客户端（容器内指向 eureka-server 服务名）
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://aslp-eureka-server:8761/eureka}
server:
  port: 8080

# VPN 安全接入（P0-2）：RS256 非对称密钥——网关经 JWKS 端点取公钥验签，
# 不再持有任何密钥（旧 HS384 共享密钥方案已移除）。密钥轮换 = auth 侧换 kid，网关零改动。
aslp:
  security:
    jwt:
      jwks-uri: http://aslp-auth-service:8084/api/auth/jwks.json
    # P2-3：可信代理清单（限流解析 XFF 的前提）。
    # 本地演示流量路径：浏览器/脚本 → Docker 端口转发（宿主侧 127.0.0.1）→ 网关容器；
    # 容器内网关看到的直接对端是宿主桥接口（192.168.65.1，Docker Desktop）或
    # bridge 网段地址。这里信任 172.16.0.0/12（Docker 默认 bridge 网段）+ 127.0.0.1，
    # 使 XFF 在演示拓扑中仍然有效（与加固前的行为对齐），同时 XFF 伪造
    # 只对「对端恰好落在可信网段内」的连接生效。
    # 生产环境（前置 Nginx/云 LB）：把这一项改成 LB 的**精确**出口 IP 列表。
    trusted-proxies: ${ASLP_TRUSTED_PROXIES:127.0.0.1, 172.16.0.0/12, 192.168.65.1}

management:
  # P1-3：链路追踪（容器内指向 aslp_zipkin；全量采样仅适合演示）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 必须用连字符别名：下划线主机名会让 java.net.URI 解析不出 host，
      # 网关（WebFlux/WebClient）上报时报 “Host is not specified”（见 readme §9 #35）
      endpoint: http://aslp-zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：docker profile 同样需要 prometheus（否则此处的 include 会覆盖基础 profile 而丢掉抓取端点）
        include: health,info,gateway,prometheus,metrics
