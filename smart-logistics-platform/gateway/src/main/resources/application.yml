spring:
  application:
    name: gateway
  # P1-2：网关限流（RequestRateLimiter -> RedisRateLimiter）依赖 Redis 令牌桶
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      # P2-1：服务发现寻址（eureka-server 就绪后启用）。各服务启动即注册，
      # 网关按服务名经 loadbalancer 解析实例 —— 实例扩容/换端口零配置变更。
      # eureka-server 未启动时网关会降级报 503（与原直连行为一致的失败语义）。
      discovery:
        locator:
          enabled: false   # 不开自动路由：路由仍显式声明（限流/鉴权 filter 按路由挂，自动化会绕开它们）
      routes:
        # P1-2：平台拉取接口单独收口（每用户 1 次/秒，burst 1）。
        # 对应 M1「针对电商平台 API 的严格限流」：一次拉取会放大成 N 次平台调用，
        # 必须比普通查询更严；order=-1 保证先于通用 order-service 路由匹配。
        - id: order-pull-throttle
          uri: lb://order-service
          order: -1
          predicates:
            - Path=/api/orders/pull
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: route-service
          uri: lb://route-service
          predicates:
            - Path=/api/routes/**,/api/route/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            # 认证入口按 IP 限流：登录前没有用户身份，只能以 IP 为维度防暴力破解
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

# P2-1：注册中心客户端（本地开发指向 localhost）
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

management:
  # P1-3：链路追踪。演示环境全量采样（生产按流量下调，如 0.1）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        # P1-1：prometheus = 抓取端点（/actuator/prometheus）；metrics = 指标清单（排查指标是否存在）
        include: health,info,gateway,prometheus,metrics
  metrics:
    tags:
      # 所有指标带上服务名标签，Prometheus 侧才能按服务区分（否则只能靠 instance 猜）
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 让 http_server_requests 输出直方图桶，Grafana 里可用 histogram_quantile 算 P95/P99
        http.server.requests: true
        # 网关的 SCG 路由级耗时（spring_cloud_gateway_requests_seconds）同样开启直方图，
        # 否则只能看到各路由的均值，看不到尾延迟
        spring.cloud.gateway.requests: true

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: INFO
