server:
  port: 8081

audit:
  chain:
    hmac-key: ${AUDIT_CHAIN_HMAC_KEY:local-demo-hmac-key-change-before-production-2026}
    key-id: ${AUDIT_CHAIN_KEY_ID:local-dev-v1}
    # 审计失败策略：true=写操作审计失败时业务回滚（fail-closed，合规默认）；
    # false=全部 fail-open（仅开发/演示）。VIEW 类操作始终 fail-open。
    fail-closed: ${AUDIT_CHAIN_FAIL_CLOSED:true}
  outbox:
    elasticsearch-url: ${AUDIT_OUTBOX_ELASTICSEARCH_URL:http://localhost:9200}

spring:
  application:
    name: gdpr-security-audit-system

  datasource:
    url: jdbc:postgresql://localhost:5432/audit_db
    username: audit_user
    password: audit_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema 由 Flyway 管理（db/migration/V1__init.sql），Hibernate 仅校验
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # DDL 由迁移账号执行；App 运行账号（audit_app）不持有 schema CREATE 权限
    user: ${FLYWAY_USER:${POSTGRES_USER:audit_user}}
    password: ${FLYWAY_PASSWORD:${POSTGRES_PASSWORD:audit_password}}

  # data.sql 已并入 V1__init.sql 种子数据，不再使用 SQL init
  sql:
    init:
      mode: never

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak 的 JWT 签发地址 (Keycloak 24 默认格式如下)
          issuer-uri: http://localhost:8080/realms/audit-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
