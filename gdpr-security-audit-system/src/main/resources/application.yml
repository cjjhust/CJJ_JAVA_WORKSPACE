server:
  port: 8081

audit:
  chain:
    hmac-key: ${AUDIT_CHAIN_HMAC_KEY:local-demo-hmac-key-change-before-production-2026}
    key-id: ${AUDIT_CHAIN_KEY_ID:local-dev-v1}

spring:
  application:
    name: gdpr-security-audit-system

  datasource:
    url: jdbc:postgresql://localhost:5432/audit_db
    username: audit_user
    password: audit_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # 让 data.sql 在 Hibernate 建表之后执行（否则表还不存在）
    defer-datasource-initialization: true

  # PostgreSQL 非嵌入式数据库，默认(嵌入式)模式不会执行 data.sql，需显式开启
  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak 的 JWT 签发地址 (Keycloak 24 默认格式如下)
          issuer-uri: http://localhost:8080/realms/audit-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
