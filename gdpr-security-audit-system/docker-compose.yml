services:
  # -----------------------------------------------------------------
  # 1. 主业务数据库：PostgreSQL 16
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audit_db}
      POSTGRES_USER: ${POSTGRES_USER:-audit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audit_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次初始化时创建 audit_app 受限账号（append-only 审计权限，见 db-hardening）
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 2. IAM 身份认证中心：Keycloak 24
  # -----------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: audit-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audit_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-audit_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-audit_password}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------------
  # 3. 日志与搜索：Elasticsearch 8.12
  # -----------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: audit-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=audit-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false # 本地开发禁用 SSL/密码以简化对接，生产环境中需开启
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 限制内存，防止笔记本爆内存
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # -----------------------------------------------------------------
  # 4. 日志收集与传输：Logstash 8.12
  # -----------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: audit-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "50000:50000/tcp"
      - "50000:50000/udp"
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch

  # -----------------------------------------------------------------
  # 4a. Elasticsearch Index Template 初始化（幂等）
  # -----------------------------------------------------------------
  es-init:
    image: curlimages/curl:8.12.1
    container_name: audit-es-init
    volumes:
      - ./scripts/es-init-template.sh:/scripts/es-init-template.sh:ro
    environment:
      ES_URL: http://elasticsearch:9200
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until curl --fail --silent http://elasticsearch:9200/ >/dev/null; do sleep 2; done;
        sh /scripts/es-init-template.sh
    depends_on:
      - elasticsearch

  # -----------------------------------------------------------------
  # 5. 可视化仪表盘：Kibana 8.12
  # -----------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: audit-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # -----------------------------------------------------------------
  # 5a. Kibana Saved Objects 初始化（dashboard + visualizations）
  # -----------------------------------------------------------------
  kibana-init:
    image: curlimages/curl:8.12.1
    container_name: audit-kibana-init
    volumes:
      - ./kibana/audit-dashboard.ndjson:/objects/audit-dashboard.ndjson:ro
      - ./kibana/audit-dashboard-extra.ndjson:/objects/audit-dashboard-extra.ndjson:ro
      - ./kibana/audit-dashboard-final.ndjson:/objects/audit-dashboard-final.ndjson:ro
      - ./kibana/audit-dashboard-xy-fix.ndjson:/objects/audit-dashboard-xy-fix.ndjson:ro
    depends_on:
      - kibana
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until curl --fail --silent http://kibana:5601/api/status >/dev/null; do sleep 2; done;
        curl --fail --silent --show-error -X POST
        'http://kibana:5601/api/saved_objects/_import?overwrite=true'
        -H 'kbn-xsrf: true'
        -F 'file=@/objects/audit-dashboard.ndjson;type=application/ndjson';
        curl --fail --silent --show-error -X POST
        'http://kibana:5601/api/saved_objects/_import?overwrite=true'
        -H 'kbn-xsrf: true'
        -F 'file=@/objects/audit-dashboard-extra.ndjson;type=application/ndjson'
        ; curl --fail --silent --show-error -X POST
        'http://kibana:5601/api/saved_objects/_import?overwrite=true'
        -H 'kbn-xsrf: true'
        -F 'file=@/objects/audit-dashboard-final.ndjson;type=application/ndjson'
        ; curl --fail --silent --show-error -X POST
        'http://kibana:5601/api/saved_objects/_import?overwrite=true'
        -H 'kbn-xsrf: true'
        -F 'file=@/objects/audit-dashboard-xy-fix.ndjson;type=application/ndjson'

  # -----------------------------------------------------------------
  # 6. Java API：Spring Boot Resource Server + 审计服务
  # -----------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audit_db}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-audit_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-audit_app_password}
      # 迁移使用具备 DDL 权限的账号，与运行账号分离
      FLYWAY_USER: ${POSTGRES_USER:-audit_user}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-audit_password}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/audit-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/audit-realm/protocol/openid-connect/certs
      AUDIT_CHAIN_HMAC_KEY: ${AUDIT_CHAIN_HMAC_KEY:?Set AUDIT_CHAIN_HMAC_KEY in .env}
      AUDIT_CHAIN_KEY_ID: ${AUDIT_CHAIN_KEY_ID:-local-dev-v1}
      AUDIT_OUTBOX_ELASTICSEARCH_URL: http://elasticsearch:9200
      LOGSTASH_HOST: logstash
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_started
      logstash:
        condition: service_started
      es-init:
        condition: service_completed_successfully

  # Optional second application instance for local Outbox concurrency drills.
  # It shares PostgreSQL and Elasticsearch but does not publish a host port.
  app-secondary:
    profiles: ["resilience"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-app-secondary
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audit_db}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-audit_app}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-audit_app_password}
      # 迁移使用具备 DDL 权限的账号，与运行账号分离
      FLYWAY_USER: ${POSTGRES_USER:-audit_user}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-audit_password}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/audit-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/audit-realm/protocol/openid-connect/certs
      AUDIT_CHAIN_HMAC_KEY: ${AUDIT_CHAIN_HMAC_KEY:?Set AUDIT_CHAIN_HMAC_KEY in .env}
      AUDIT_CHAIN_KEY_ID: ${AUDIT_CHAIN_KEY_ID:-local-dev-v1}
      AUDIT_OUTBOX_ELASTICSEARCH_URL: http://elasticsearch:9200
      LOGSTASH_HOST: logstash
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_started
      logstash:
        condition: service_started
      es-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
  es_data:
    driver: local
