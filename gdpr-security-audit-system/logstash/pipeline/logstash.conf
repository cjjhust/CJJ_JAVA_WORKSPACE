input {
  tcp {
    port => 50000
    codec => json_lines
  }
}

filter {
  # 解析审计日志中的时间戳，覆盖 @timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 添加环境标签，清理无意义字段
  mutate {
    add_field => { "environment" => "development" }
    remove_field => ["host", "port", "@version"]
  }

  # 根据操作类型标注严重级别：高危（删除/导出/下载）> 中危（修改）> 低危
  if [action] in ["DELETE", "EXPORT", "DOWNLOAD"] {
    mutate { add_field => { "severity" => "HIGH" } }
  } else if [action] == "MODIFY" {
    mutate { add_field => { "severity" => "MEDIUM" } }
  } else {
    mutate { add_field => { "severity" => "LOW" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "audit-logs-%{+YYYY.MM.dd}"
    # 幂等去重：同一审计事件（auditLogId）重复投递只写一份文档
    document_id => "%{auditLogId}"
  }
  # 开发环境同时输出到控制台便于调试
  stdout { codec => rubydebug }
}
