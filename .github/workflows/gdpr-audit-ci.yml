name: GDPR Audit Service · CI

# 只在本项目目录或本工作流本身发生变化时触发，避免同仓库其它项目提交时误跑。
on:
  push:
    branches: [main]
    paths:
      - 'gdpr-security-audit-system/**'
      - '.github/workflows/gdpr-audit-ci.yml'
  pull_request:
    paths:
      - 'gdpr-security-audit-system/**'
      - '.github/workflows/gdpr-audit-ci.yml'
  workflow_dispatch:

# 同一分支的新提交会取消上一次仍在跑的构建，节省 runner 时间。
concurrency:
  group: gdpr-audit-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify（单测 + Testcontainers 集成测试 + JaCoCo 门槛）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gdpr-security-audit-system
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gdpr-security-audit-system/pom.xml

      - name: Show Docker / Docker Compose versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version

      # Elasticsearch 容器要求 vm.max_map_count >= 262144，GitHub 托管 runner
      # 默认只有 65530，不调会让 ES 容器在 bootstrap check 阶段直接退出。
      - name: Tune kernel for Elasticsearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sysctl vm.max_map_count

      # GitHub 的 ubuntu-latest runner 自带可用的 Docker，Testcontainers 会直接拉起
      # PostgreSQL 16 与 Elasticsearch 8.12 容器；SchemaPrivilegeIT 按
      # initdb → V1__init.sql → V2__grant_audit_app.sql 的顺序验证权限链路。
      - name: Build and run all tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            gdpr-security-audit-system/target/surefire-reports/**
            gdpr-security-audit-system/target/failsafe-reports/**
            gdpr-security-audit-system/target/site/jacoco/**
          retention-days: 7

  image:
    name: docker build + compose 配置校验
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files（default + resilience profile）
        working-directory: gdpr-security-audit-system
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile resilience config --quiet

      - name: Build application image
        run: docker build -t gdpr-audit-service:ci ./gdpr-security-audit-system
